server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
#      host: redis
      port: 6379

  boot:
    admin:
      client:
#        url: http://admin:9090
        url: http://localhost:9090

  cloud:
    gateway:

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      globalcors:

        add-to-simple-url-handler-mapping: true

        cors-configurations:
          '[/**]':

            allowedOrigins:
              - "http://localhost:4200"
#            allowedOrigins:
#              - "http://parkeasee.s3-website.eu-north-1.amazonaws.com"

            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH

            allowedHeaders: "*"

            exposedHeaders:
              - Authorization
              - Content-Type

            allowCredentials: true
            maxAge: 3600

      routes:

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RoleFilter
              args:
                roles:
                  - PUBLIC

        - id: oauth2-authorization
          uri: lb://auth-service
          predicates:
            - Path=/oauth2/authorization/**
          filters:
            - name: RoleFilter
              args:
                roles:
                  - PUBLIC

        - id: oauth2-callback
          uri: lb://auth-service
          predicates:
            - Path=/login/oauth2/code/**
          filters:
            - name: RoleFilter
              args:
                roles:
                  - PUBLIC

        - id: user-service
          uri: lb://auth-service
          predicates:
            - Path=/api/user/**
          filters:
            - name: RoleFilter
              args:
                roles:
                  - DRIVER
                  - MANAGER
                  - ADMIN

        - id: admin-service
          uri: lb://auth-service
          predicates:
            - Path=/api/admin/**
          filters:
            - name: RoleFilter
              args:
                roles:
                  - ADMIN

        - id: vehicle-service
          uri: lb://vehicle-service
          predicates:
            - Path=/api/vehicle/**
          filters:
            - name: RoleFilter
              args:
                roles:
                  - DRIVER
                  - ADMIN

        - id: parkinglot-read
          uri: lb://parkinglot-service
          predicates:
            - Path=/api/parking-lots/**
            - Method=GET
          filters:
            - name: RoleFilter
              args:
                roles:
                  - PUBLIC
                  - DRIVER
                  - MANAGER
                  - ADMIN

        - id: parkinglot-write
          uri: lb://parkinglot-service
          predicates:
            - Path=/api/parking-lots/**
            - Method=POST,PUT,DELETE,PATCH
          filters:
            - name: RoleFilter
              args:
                roles:
                  - MANAGER
                  - ADMIN

        - id: parkingspot-read
          uri: lb://parkingspot-service
          predicates:
            - Path=/api/parking-spots/**
            - Method=GET
          filters:
            - name: RoleFilter
              args:
                roles:
                  - DRIVER
                  - MANAGER
                  - ADMIN

        - id: parkingspot-write
          uri: lb://parkingspot-service
          predicates:
            - Path=/api/parking-spots/**
            - Method=POST,PUT,DELETE,PATCH
          filters:
            - name: RoleFilter
              args:
                roles:
                  - MANAGER
                  - ADMIN
                  - DRIVER

        - id: booking-read
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**
            - Method=GET
          filters:
            - name: RoleFilter
              args:
                roles:
                  - DRIVER
                  - MANAGER
                  - ADMIN

        - id: booking-write
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**
            - Method=POST,PUT,DELETE
          filters:
            - name: RoleFilter
              args:
                roles:
                  - DRIVER
                  - ADMIN

        - id: payment-read
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
            - Method=GET
          filters:
            - name: RoleFilter
              args:
                roles:
                  - DRIVER
                  - ADMIN

        - id: payment-write
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
            - Method=POST,PUT,DELETE,PATCH
          filters:
            - name: RoleFilter
              args:
                roles:
                  - DRIVER
                  - ADMIN

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: RoleFilter
              args:
                roles:
                  - DRIVER
                  - MANAGER
                  - ADMIN

        - id: receipt-service
          uri: lb://receipt-service
          predicates:
            - Path=/api/receipts/**
          filters:
            - name: RoleFilter
              args:
                roles:
                  - DRIVER
                  - ADMIN

eureka:
  client:
    service-url:
#      defaultZone: http://eureka:8761/eureka/
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
#    hostname: api-gateway
    instance-id: ${spring.application.name}:${server.port}

security:
  jwt:
    secret: ${JWT_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true