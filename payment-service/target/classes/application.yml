spring:
  application:
    name: payment-service

  boot:
    admin:
      client:
#        url: http://admin:9090
        url: http://localhost:9090

  cloud:
    openfeign:
      okhttp:
        enabled: true

  datasource:
    url: ${DATABASE}
    username: ${USERNAME}
    password: ${PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
#    host: rabbitmq
    host : localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8087

internal:
  auth:
    token: ${INTERNAL_AUTH_TOKEN:parkease-internal}



eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true

    service-url:
#      defaultZone: http://eureka:8761/eureka/
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
#    hostname: payment-service
    instance-id: ${spring.application.name}:${server.port}

razorpay:
  key: ${RAZORPAY_KEY:rzp_test_placeholder}
  secret: ${RAZORPAY_SECRET:secret_placeholder}

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true