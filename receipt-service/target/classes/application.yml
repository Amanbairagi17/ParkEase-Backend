spring:
  application:
    name: receipt-service

  boot:
    admin:
      client:
        url: http://localhost:9090

  cloud:
    openfeign:
      okhttp:
        enabled: true

  datasource:
    url: ${DATABASE}
    username: ${USERNAME}
    password: ${PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        missing-queues-fatal: false

server:
  port: 8093

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

receipt:
  storage:
    path: ${RECEIPT_STORAGE_PATH:receipts}
  download:
    base-url: ${RECEIPT_DOWNLOAD_BASE_URL:/api/receipts/download}
  service-auth:
    user-id: ${RECEIPT_SERVICE_USER_ID:0}
    roles: ${RECEIPT_SERVICE_ROLES:ROLE_ADMIN}

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true
