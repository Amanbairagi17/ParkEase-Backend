spring:
  application:
    name: notification-service

  boot:
    admin:
      client:
#        url: http://admin:9090
        url: http://localhost:9090

  datasource:
    url: ${DATABASE}
    username: ${USERNAME}
    password: ${PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  rabbitmq:
    host: localhost
#    host: rabbitmq
    port: 5672
    username: guest
    password: guest

server:
  port: 8086

brevo:
  api-key: ${BREVO_API_KEY}
  sender:
    email: ${BREVO_SENDER_MAIL}
    name: ${BREVO_SENDER_NAME}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
#      defaultZone: http://eureka:8761/eureka/
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
#    hostname: notification-service
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true