spring:
  application:
    name: vehicle-service

  boot:
    admin:
      client:
#        url: http://admin:9090
        url: http://localhost:9090

  datasource:
    url: ${DATABASE}
    username: ${USERNAME}
    password: ${PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8082

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true

    service-url:
#      defaultZone: http://eureka:8761/eureka/
       defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
#    hostname: vehicle-service
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true