spring:
  application:
    name: booking-service

  boot:
    admin:
      client:
        url: http://localhost:9090
#        url: http://admin:9090


  cloud:
    openfeign:
      okhttp:
        enabled: true

  datasource:
    url: ${DATABASE}
    username: ${USERNAME}
    password: ${PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: false

  rabbitmq:
    host: localhost
#    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        missing-queues-fatal: false

server:
  port: 8085

internal:
  auth:
    token: ${INTERNAL_AUTH_TOKEN:parkease-internal}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    service-url:
#      defaultZone: http://eureka:8761/eureka/
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
#    hostname: booking-service
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true